apiVersion: v2
appVersion: 3.1.4
description: Drag & drop UI to build your customized LLM flow
home: https://flowiseai.com/
icon: https://avatars.githubusercontent.com/u/128289781
maintainers:
  - name: sebastien-prudhomme
    email: sebastien.prudhomme@gmail.com
name: flowise
sources:
  - https://github.com/FlowiseAI/Flowise
  - https://github.com/ptrslvk/charts/tree/master/charts/flowise
version: 6.0.0
dependencies:
  - name: common
    version: 2.31.3
    repository: oci://ghcr.io/ptrslvk/charts
  - name: mariadb
    version: 20.4.2
    repository: oci://ghcr.io/ptrslvk/charts
    condition: mariadb.enabled
  - name: postgresql
    version: 18.6
    repository: oci://ghcr.io/ptrslvk/charts
    condition: postgresql.enabled
  - name: redis
    version: 21.2.6
    repository: oci://ghcr.io/ptrslvk/charts
    condition: redis.enabled
  kubeVersion: ">=1.24"
